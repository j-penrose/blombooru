<!-- Admin Account Management Section -->
<div class="surface p-2 sm:p-6 border">
    <h2 class="text-base font-bold mb-4 pb-3 border-b">{{ t('admin.account.title') }}</h2>

    <div class="mb-6">
        <form id="change-admin-password-form">
            <div class="mb-4">
                <label class="block text-xs font-bold mb-2">{{ t('admin.account.new_password') }}</label>
                <input type="password" id="new-admin-password" required minlength="6" maxlength="50"
                    placeholder="password123"
                    class="w-full bg px-3 py-2 border text-xs focus:outline-none hover:border-primary transition-colors focus:border-primary">
                <p class="text-xs text-secondary opacity-70 mt-1 ml-1">
                    {{ t('admin.account.password_hint') }}
                </p>
            </div>

            <button type="submit" class="btn-primary">
                {{ t('admin.account.change_password') }}
            </button>
        </form>

        <div id="change-password-status" style="display: none;" class="mt-3">
            <div class="text-xs">
                <div id="change-password-result"></div>
            </div>
        </div>
    </div>

    <form id="change-admin-username-form">
        <div class="mb-4">
            <label class="block text-xs font-bold mb-2">{{ t('admin.account.new_username') }}</label>
            <input type="text" id="new-admin-username" required placeholder="admin"
                class="w-full bg px-3 py-2 border text-xs focus:outline-none hover:border-primary transition-colors focus:border-primary">
        </div>

        <button type="submit" class="btn-primary">
            {{ t('admin.account.change_username') }}
        </button>
    </form>

    <div id="change-username-status" style="display: none;" class="mt-3">
        <div class="text-xs">
            <div id="change-username-result"></div>
        </div>
    </div>
</div>

<!-- Keyboard Shortcuts Section -->
<div class="surface p-2 sm:p-6 border mt-4" id="keybindings-section">
    <h2 class="text-base font-bold mb-1 pb-3 border-b">{{ t('admin.keybindings.title') }}</h2>
    <p class="text-xs text-secondary mt-3 mb-4">{{ t('admin.keybindings.description') }}</p>

    <div class="bg p-2 sm:p-4 border mb-4">
        <div id="keybindings-context-media_viewer" class="mb-4">
            <h3 class="text-xs font-bold text uppercase tracking-wide border-b mb-2 pb-2">
                {{ t('admin.keybindings.context_media_viewer') }}
            </h3>
            <div class="keybindings-rows space-y-2"></div>
        </div>

        <div id="keybindings-context-tag_autocomplete">
            <h3 class="text-xs font-bold text uppercase tracking-wide border-b mb-2 pb-2">
                {{ t('admin.keybindings.context_tag_autocomplete') }}
            </h3>
            <div class="keybindings-rows space-y-2"></div>
        </div>

        <div id="keybindings-status" style="display:none;"></div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
        <button id="keybindings-save-btn" class="btn-primary text-xs px-4 py-2 flex items-center gap-2">
            {{ t('admin.keybindings.save_btn') }}
        </button>
        <button id="keybindings-reset-all-btn" class="btn-danger text-xs px-4 py-2 flex items-center gap-2">
            {{ t('admin.keybindings.reset_all') }}
        </button>
    </div>
</div>
